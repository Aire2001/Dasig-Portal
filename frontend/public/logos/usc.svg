<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="uscGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="uscGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>
  <!-- Outer Green Base & Gold Ring -->
  <circle cx="100" cy="100" r="98" fill="url(#uscGreen)" stroke="url(#uscGold)" stroke-width="4"/>
  <circle cx="100" cy="100" r="86" fill="none" stroke="url(#uscGold)" stroke-width="1.5"/>
  <circle cx="100" cy="100" r="74" fill="#022c22" stroke="url(#uscGold)" stroke-width="2"/>

  <!-- Carolinian Laurel Leaves -->
  <path d="M50 100 C50 65 72 46 100 44 C128 46 150 65 150 100 C150 135 128 154 100 156 C72 154 50 135 50 100 Z" fill="none" stroke="url(#uscGold)" stroke-width="1.5" stroke-dasharray="4 2" opacity="0.6"/>

  <!-- Central SVD Cross & Rays -->
  <g stroke="url(#uscGold)" stroke-width="2.5" fill="none">
    <line x1="100" y1="56" x2="100" y2="100"/>
    <line x1="82" y1="72" x2="118" y2="72"/>
  </g>
  <!-- Carolinian Star -->
  <polygon points="100,50 102,58 110,60 102,62 100,70 98,62 90,60 98,58" fill="url(#uscGold)"/>

  <!-- Open Book of Knowledge -->
  <path d="M82 86 C90 84 98 86 100 88 C102 86 110 84 118 86 L118 102 C110 100 102 102 100 104 C98 102 90 100 82 102 Z" fill="#ffffff" stroke="url(#uscGold)" stroke-width="1.5"/>
  <line x1="100" y1="88" x2="100" y2="104" stroke="#064e3b" stroke-width="1.5"/>

  <!-- USC Text -->
  <text x="100" y="128" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="bold" fill="url(#uscGold)" text-anchor="middle" letter-spacing="3">USC</text>
  <text x="100" y="142" font-family="Arial, sans-serif" font-size="8.5" font-weight="700" fill="#fef08a" text-anchor="middle" letter-spacing="1.5">EST. 1595</text>

  <!-- Top curved text -->
  <path id="curve-usc-top" d="M 24,100 A 76,76 0 0,1 176,100" fill="none"/>
  <text font-family="Arial, sans-serif" font-size="8" font-weight="800" fill="url(#uscGold)" text-anchor="middle" letter-spacing="1.2">
    <textPath href="#curve-usc-top" startOffset="50%">UNIVERSITY OF SAN CARLOS</textPath>
  </text>

  <!-- Bottom curved text -->
  <path id="curve-usc-bot" d="M 30,118 A 72,72 0 0,0 170,118" fill="none"/>
  <text font-family="Arial, sans-serif" font-size="8" font-weight="800" fill="url(#uscGold)" text-anchor="middle" letter-spacing="2">
    <textPath href="#curve-usc-bot" startOffset="50%">CEBU CITY · PHILIPPINES</textPath>
  </text>
</svg>

