<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <circle cx="100" cy="100" r="98" fill="#1e3a8a" stroke="#d4af37" stroke-width="4"/>
  <circle cx="100" cy="100" r="85" fill="none" stroke="#d4af37" stroke-width="1.5"/>
  <!-- Cross / Augustinian symbol -->
  <rect x="93" y="48" width="14" height="55" rx="3" fill="#d4af37"/>
  <rect x="68" y="68" width="64" height="14" rx="3" fill="#d4af37"/>
  <!-- Heart shape (Augustinian symbol - heart of St. Augustine) -->
  <path d="M100 148 Q82 132 78 122 Q74 110 82 104 Q90 98 100 108 Q110 98 118 104 Q126 110 122 122 Q118 132 100 148 Z" fill="#d4af37"/>
  <!-- USa text -->
  <text x="100" y="175" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#d4af37" text-anchor="middle" letter-spacing="2">USa</text>
  <!-- Top curved text -->
  <path id="curve-usa-top" d="M 22,96 A 78,78 0 0,1 178,96" fill="none"/>
  <text font-family="Arial, sans-serif" font-size="8" fill="#d4af37" text-anchor="middle">
    <textPath href="#curve-usa-top" startOffset="50%">UNIVERSITY OF SAN AGUSTIN</textPath>
  </text>
  <!-- Bottom curved -->
  <path id="curve-usa-bot" d="M 35,120 A 65,65 0 0,0 165,120" fill="none"/>
  <text font-family="Arial, sans-serif" font-size="7.5" fill="rgba(212,175,55,0.8)" text-anchor="middle">
    <textPath href="#curve-usa-bot" startOffset="50%">ILOILO CITY · EST. 1904</textPath>
  </text>
</svg>